<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Voli - Stadion Kucur</title>

<style>
:root{
    --bg:#070b12;
    --panel:#101722;
    --panel2:#151e2b;
    --gold:#f5c542;
    --gold2:#ffdf70;
    --white:#f7f8fb;
    --muted:#9ca8b8;
    --red:#ff4d5a;
    --green:#35d07f;
    --blue:#3fa9ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--white)}
body{overflow:hidden}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 50% -20%,rgba(245,197,66,.15),transparent 38%),
      linear-gradient(135deg,#05080d,#0b111b 50%,#06090f);
}

.topbar{
    min-height:86px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 28px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,13,.82);
    backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:15px}
.logo{
    width:58px;height:58px;border-radius:50%;
    border:3px solid var(--gold);
    display:grid;place-items:center;
    background:linear-gradient(145deg,#1b2534,#070a10);
    box-shadow:0 0 22px rgba(245,197,66,.22);
    flex:none;
}
.logo svg{width:42px;height:42px}
.brand h1{margin:0;font-size:22px;letter-spacing:1.5px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:1px}
.top-actions{display:flex;gap:8px;align-items:center}

button{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    color:#fff;
    background:#202b3a;
    cursor:pointer;
    font-weight:700;
    transition:.15s;
}
button:hover{filter:brightness(1.15);transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}
.btn-gold{background:var(--gold);color:#111}
.btn-red{background:#a92734}
.btn-green{background:#197d4d}
.btn-blue{background:#17639a}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding:18px 24px;
    gap:14px;
}

.event{
    text-align:center;
    flex:none;
}
.event .small{
    color:var(--gold);
    font-size:12px;
    font-weight:800;
    letter-spacing:4px;
}
.event h2{
    margin:4px 0 2px;
    font-size:clamp(24px,3vw,42px);
    letter-spacing:3px;
}
.event .place{
    color:var(--muted);
    font-size:14px;
    letter-spacing:1px;
}

.score-area{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 180px 1fr;
    gap:18px;
    align-items:stretch;
}

.team{
    min-width:0;
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    background:linear-gradient(145deg,rgba(25,35,49,.95),rgba(10,15,23,.98));
    box-shadow:0 15px 45px rgba(0,0,0,.28);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.team-head{
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.035);
    border-bottom:1px solid rgba(255,255,255,.07);
}
.team-name{
    font-size:clamp(18px,2.2vw,30px);
    font-weight:900;
    letter-spacing:1px;
    outline:none;
    border-bottom:2px solid transparent;
}
.team-name:focus{border-color:var(--gold)}
.side-tag{
    font-size:11px;
    color:var(--gold);
    font-weight:900;
    letter-spacing:2px;
}
.score{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(120px,18vw,250px);
    font-weight:1000;
    line-height:.8;
    letter-spacing:-8px;
    text-shadow:0 8px 35px rgba(0,0,0,.5);
}
.team-a .score{color:#fff}
.team-b .score{color:var(--gold2)}
.team-controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    padding:14px;
}
.point-btn{
    height:58px;
    font-size:25px;
    border-radius:12px;
}
.plus{background:#1b8052}
.minus{background:#303b4a}
.setwin{background:#8b6a13;color:#fff}

.center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
}
.set-box{
    width:100%;
    padding:15px 10px;
    border:1px solid rgba(245,197,66,.3);
    border-radius:16px;
    background:linear-gradient(145deg,#171e29,#0c1119);
    text-align:center;
}
.set-label{font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:900}
.set-number{font-size:54px;font-weight:1000;color:var(--gold);margin:2px 0}
.set-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.set-controls button{padding:9px 5px;font-size:12px}

.serve{
    width:100%;
    padding:13px 8px;
    border-radius:14px;
    text-align:center;
    background:#0c121b;
    border:1px solid rgba(255,255,255,.08);
}
.serve-label{font-size:10px;color:var(--muted);letter-spacing:2px}
.serve-value{font-size:16px;font-weight:900;margin-top:5px;color:var(--green)}

.set-history{
    flex:none;
    min-height:74px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}
.set-card{
    min-width:100px;
    padding:8px 12px;
    border-radius:10px;
    background:#101824;
    border:1px solid rgba(255,255,255,.08);
    text-align:center;
}
.set-card small{display:block;color:var(--muted);font-size:9px;letter-spacing:1px}
.set-card b{font-size:18px}
.winner{border-color:var(--gold);box-shadow:0 0 15px rgba(245,197,66,.15)}

.bottom{
    flex:none;
    min-height:46px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:11px;
    padding:0 4px;
}
.clock{font-variant-numeric:tabular-nums}

.modal{
    position:fixed;inset:0;background:rgba(0,0,0,.72);
    display:none;align-items:center;justify-content:center;
    z-index:20;padding:20px;
}
.modal.show{display:flex}
.modal-box{
    width:min(520px,100%);
    background:#111923;
    border:1px solid rgba(245,197,66,.3);
    border-radius:18px;
    padding:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.modal-box h3{margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.field input{
    width:100%;padding:12px;border-radius:9px;border:1px solid #334154;
    background:#0a1018;color:#fff;font-size:16px;outline:none;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

@media(max-width:900px){
    body{overflow:auto}
    .app{min-height:100vh}
    .topbar{padding:10px 14px}
    .brand h1{font-size:16px}
    .brand p{font-size:9px}
    .top-actions button{font-size:10px;padding:8px}
    .main{padding:12px}
    .score-area{grid-template-columns:1fr 100px 1fr;gap:8px}
    .team{border-radius:14px}
    .team-head{padding:10px}
    .team-controls{padding:8px;gap:5px}
    .point-btn{height:48px;font-size:20px}
    .score{font-size:clamp(90px,19vw,160px);letter-spacing:-5px}
    .set-box{padding:10px 5px}
    .set-number{font-size:38px}
}
@media(max-width:650px){
    body{overflow:auto}
    .topbar{min-height:64px}
    .logo{width:42px;height:42px}
    .logo svg{width:30px;height:30px}
    .top-actions button:nth-child(1){display:none}
    .event h2{font-size:22px}
    .score-area{grid-template-columns:1fr;gap:10px}
    .center{order:-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .serve{display:none}
    .set-box{width:auto}
    .team{min-height:250px}
    .score{font-size:110px;min-height:130px}
    .bottom{font-size:9px}
}

.result-box{max-width:760px;max-height:90vh;overflow:auto}
.result-sheet{
    background:#fff;color:#111;border-radius:10px;padding:24px;
    font-family:Arial,Helvetica,sans-serif;
}
.result-sheet .rs-title{text-align:center;margin:0;font-size:25px;letter-spacing:2px}
.result-sheet .rs-sub{text-align:center;margin:5px 0;color:#555}
.result-sheet .rs-place{text-align:center;font-weight:700;margin:12px 0 20px}
.result-score{
    display:grid;grid-template-columns:1fr auto 1fr;gap:15px;
    align-items:center;text-align:center;margin:15px 0 22px
}
.result-team{font-size:18px;font-weight:800}
.result-big{font-size:48px;font-weight:1000}
.result-vs{font-size:13px;color:#666}
.result-table{width:100%;border-collapse:collapse;margin-top:12px}
.result-table th,.result-table td{border:1px solid #bbb;padding:9px;text-align:center}
.result-table th{background:#eee}
.rs-footer{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:50px;text-align:center}
.rs-sign{height:70px}
@media print{
    body *{visibility:hidden!important}
    #printArea,#printArea *{visibility:visible!important}
    #printArea{
        position:absolute;left:0;top:0;width:100%;
    }
}

</style>
</head>

<body>
<div class="app">

<header class="topbar">
    <div class="brand">
        <div class="logo" title="Logo Karang Taruna">
            <!-- Logo sederhana Karang Taruna -->
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="43" fill="none" stroke="#f5c542" stroke-width="4"/>
                <path d="M25 65 L35 38 L50 55 L65 28 L76 65" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="35" cy="30" r="7" fill="#f5c542"/>
                <circle cx="65" cy="21" r="7" fill="#f5c542"/>
                <path d="M24 75 Q50 84 76 75" fill="none" stroke="#f5c542" stroke-width="4"/>
            </svg>
        </div>
        <div>
            <h1>KARANG TARUNA BAKTI REMAJA</h1>
            <p>JATEN RW 005 • MIRICINDE • PURWANTORO</p>
        </div>
    </div>
    <div class="top-actions">
        <button class="btn-blue" onclick="openResult()">📄 Hasil</button>
        <button class="btn-blue" onclick="openSettings()">⚙ Pengaturan</button>
        <button class="btn-gold" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
    </div>
</header>

<main class="main">
    <section class="event">
        <div class="small">VOLLEYBALL SCOREBOARD</div>
        <h2>STADION KUCUR</h2>
        <div class="place">Jaten RW 005 – Miricinde – Purwantoro</div>
    </section>

    <section class="score-area">
        <div class="team team-a">
            <div class="team-head">
                <div id="nameA" class="team-name" contenteditable="true" spellcheck="false">TIM A</div>
                <div class="side-tag">HOME</div>
            </div>
            <div id="scoreA" class="score">0</div>
            <div class="team-controls">
                <button class="point-btn minus" onclick="changeScore('A',-1)">−</button>
                <button class="point-btn plus" onclick="changeScore('A',1)">+</button>
                <button class="setwin" onclick="winSet('A')">MENANG SET</button>
            </div>
        </div>

        <div class="center">
            <div class="set-box">
                <div class="set-label">SET AKTIF</div>
                <div id="setNumber" class="set-number">1</div>
                <div class="set-controls">
                    <button onclick="changeSet(-1)">− SET</button>
                    <button onclick="changeSet(1)">+ SET</button>
                </div>
            </div>

            <div class="serve">
                <div class="serve-label">SERVE</div>
                <div id="serveValue" class="serve-value">TIM A</div>
                <button style="margin-top:8px;width:100%;padding:7px" onclick="toggleServe()">GANTI SERVE</button>
            </div>
        </div>

        <div class="team team-b">
            <div class="team-head">
                <div id="nameB" class="team-name" contenteditable="true" spellcheck="false">TIM B</div>
                <div class="side-tag">AWAY</div>
            </div>
            <div id="scoreB" class="score">0</div>
            <div class="team-controls">
                <button class="point-btn minus" onclick="changeScore('B',-1)">−</button>
                <button class="point-btn plus" onclick="changeScore('B',1)">+</button>
                <button class="setwin" onclick="winSet('B')">MENANG SET</button>
            </div>
        </div>
    </section>

    <section id="history" class="set-history"></section>

    <footer class="bottom">
        <div>🏐 STADION KUCUR • SCOREBOARD DIGITAL</div>
        <div class="clock" id="clock">00:00:00</div>
    </footer>
</main>
</div>


<div class="modal" id="resultModal">
    <div class="modal-box result-box">
        <h3>📄 Hasil Pertandingan</h3>
        <div id="resultPreview"></div>
        <div class="modal-actions">
            <button onclick="closeResult()">Tutup</button>
            <button class="btn-blue" onclick="downloadResultCSV()">⬇ CSV</button>
            <button class="btn-green" onclick="downloadResultHTML()">💾 File Hasil</button>
            <button class="btn-gold" onclick="printResult()">🖨 Cetak / PDF</button>
        </div>
    </div>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-box">
        <h3>⚙ Pengaturan Pertandingan</h3>

        <div class="field">
            <label>NAMA TIM A</label>
            <input id="inputA" value="TIM A">
        </div>

        <div class="field">
            <label>NAMA TIM B</label>
            <input id="inputB" value="TIM B">
        </div>

        <div class="field">
            <label>SET AKTIF</label>
            <input id="inputSet" type="number" min="1" max="5" value="1">
        </div>

        <div class="modal-actions">
            <button onclick="closeSettings()">Batal</button>
            <button class="btn-red" onclick="resetMatch()">Reset Pertandingan</button>
            <button class="btn-gold" onclick="saveSettings()">Simpan</button>
        </div>
    </div>
</div>

<script>
let scoreA = 0;
let scoreB = 0;
let activeSet = 1;
let serve = 'A';
let history = [];

const $ = id => document.getElementById(id);

function render(){
    $('scoreA').textContent = scoreA;
    $('scoreB').textContent = scoreB;
    $('setNumber').textContent = activeSet;
    $('serveValue').textContent = serve === 'A' ? $('nameA').textContent.trim() : $('nameB').textContent.trim();

    $('history').innerHTML = history.length
        ? history.map((x,i)=>`
            <div class="set-card ${x.winner?'winner':''}">
                <small>SET ${i+1}</small>
                <b>${x.a} — ${x.b}</b>
                ${x.winner ? `<small>${escapeHtml(x.winner)} MENANG</small>` : ''}
            </div>`).join('')
        : '<div style="color:#657285;font-size:11px">Belum ada hasil set</div>';
}

function escapeHtml(str){
    return str.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function changeScore(team, value){
    if(team === 'A'){
        scoreA = Math.max(0, scoreA + value);
    }else{
        scoreB = Math.max(0, scoreB + value);
    }
    if(value > 0) serve = team;
    render();
}

function winSet(team){
    history.push({
        a:scoreA,
        b:scoreB,
        winner: team === 'A' ? $('nameA').textContent.trim() : $('nameB').textContent.trim()
    });

    if(activeSet < 5){
        activeSet++;
        scoreA = 0;
        scoreB = 0;
        serve = team;
    }else{
        alert('Pertandingan sudah mencapai SET 5. Gunakan Reset Pertandingan untuk pertandingan baru.');
    }
    render();
}

function changeSet(v){
    activeSet = Math.min(5, Math.max(1, activeSet + v));
    render();
}

function toggleServe(){
    serve = serve === 'A' ? 'B' : 'A';
    render();
}

function openSettings(){
    $('inputA').value = $('nameA').textContent.trim();
    $('inputB').value = $('nameB').textContent.trim();
    $('inputSet').value = activeSet;
    $('settingsModal').classList.add('show');
}
function closeSettings(){
    $('settingsModal').classList.remove('show');
}
function saveSettings(){
    $('nameA').textContent = $('inputA').value.trim() || 'TIM A';
    $('nameB').textContent = $('inputB').value.trim() || 'TIM B';
    activeSet = Math.min(5, Math.max(1, parseInt($('inputSet').value) || 1));
    closeSettings();
    render();
}

function resetMatch(){
    if(!confirm('Reset seluruh pertandingan dan hasil set?')) return;
    scoreA = 0;
    scoreB = 0;
    activeSet = 1;
    serve = 'A';
    history = [];
    closeSettings();
    render();
}

function toggleFullscreen(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
    }else{
        document.exitFullscreen().catch(()=>{});
    }
}

$('nameA').addEventListener('input', render);
$('nameB').addEventListener('input', render);

document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && $('settingsModal').classList.contains('show')){
        closeSettings();
        return;
    }
    if(e.key === 'ArrowLeft') changeScore('A',1);
    if(e.key === 'ArrowRight') changeScore('B',1);
    if(e.key.toLowerCase() === 'a') changeScore('A',-1);
    if(e.key.toLowerCase() === 'b') changeScore('B',-1);
    if(e.key === 'f' || e.key === 'F') toggleFullscreen();
});

function updateClock(){
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('id-ID',{hour12:false});
}
setInterval(updateClock,1000);
updateClock();
render();

function openResult(){
    const winner = scoreA === scoreB ? 'SERI' : (scoreA > scoreB ? $('nameA').textContent.trim() : $('nameB').textContent.trim());
    let rows = '';
    if(history.length){
        rows = history.map((x,i)=>`
            <tr>
                <td>SET ${i+1}</td>
                <td>${escapeHtml(x.a)}</td>
                <td>${escapeHtml(x.b)}</td>
                <td>${escapeHtml(x.winner || '-')}</td>
            </tr>`).join('');
    }else{
        rows = `<tr><td>Set berjalan</td><td>${scoreA}</td><td>${scoreB}</td><td>-</td></tr>`;
    }

    const totalA = history.reduce((n,x)=>n+(x.winner === $('nameA').textContent.trim()?1:0),0);
    const totalB = history.reduce((n,x)=>n+(x.winner === $('nameB').textContent.trim()?1:0),0);

    $('resultPreview').innerHTML = `
      <div id="printArea" class="result-sheet">
        <div class="rs-title">KARANG TARUNA BAKTI REMAJA</div>
        <div class="rs-sub">STADION KUCUR</div>
        <div class="rs-place">Jaten RW 005 • Miricinde • Purwantoro</div>

        <div class="result-score">
          <div>
            <div class="result-team">${escapeHtml($('nameA').textContent.trim())}</div>
            <div class="result-big">${scoreA}</div>
            <div>Set Menang: ${totalA}</div>
          </div>
          <div class="result-vs">VS</div>
          <div>
            <div class="result-team">${escapeHtml($('nameB').textContent.trim())}</div>
            <div class="result-big">${scoreB}</div>
            <div>Set Menang: ${totalB}</div>
          </div>
        </div>

        <table class="result-table">
          <thead><tr><th>Set</th><th>${escapeHtml($('nameA').textContent.trim())}</th><th>${escapeHtml($('nameB').textContent.trim())}</th><th>Pemenang</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>

        <p style="text-align:center;margin-top:18px"><b>Status:</b> ${escapeHtml(winner)}</p>

        <div class="rs-footer">
          <div>Wasit / Petugas<br><div class="rs-sign"></div>(________________)</div>
          <div>Panitia<br><div class="rs-sign"></div>(________________)</div>
        </div>
        <div style="text-align:center;margin-top:18px;font-size:10px;color:#777">
          Dicetak dari Scoreboard Digital Stadion Kucur
        </div>
      </div>`;
    $('resultModal').classList.add('show');
}

function closeResult(){ $('resultModal').classList.remove('show'); }

function printResult(){
    openResult();
    setTimeout(()=>window.print(),150);
}

function getResultData(){
    return {
        tempat:"STADION KUCUR",
        penyelenggara:"KARANG TARUNA BAKTI REMAJA",
        lokasi:"Jaten RW 005 - Miricinde - Purwantoro",
        timA:$('nameA').textContent.trim(),
        timB:$('nameB').textContent.trim(),
        skorA:scoreA,
        skorB:scoreB,
        setAktif:activeSet,
        hasilSet:history,
        waktu:new Date().toLocaleString('id-ID')
    };
}

function downloadResultCSV(){
    const d=getResultData();
    let csv="STADION KUCUR\\nKARANG TARUNA BAKTI REMAJA\\nJaten RW 005 - Miricinde - Purwantoro\\n\\n";
    csv+="TIM A,TIM B,SKOR A,SKOR B,STATUS\\n";
    csv+=`"${d.timA.replace(/"/g,'""')}","${d.timB.replace(/"/g,'""')}",${d.skorA},${d.skorB},"${d.skorA===d.skorB?'SERI':(d.skorA>d.skorB?d.timA:d.timB)}"\\n\\n`;
    csv+="SET,SKOR TIM A,SKOR TIM B,PEMENANG\\n";
    if(d.hasilSet.length){
        d.hasilSet.forEach((x,i)=>{
            csv+=`"${i+1}",${x.a},${x.b},"${(x.winner||'').replace(/"/g,'""')}"\\n`;
        });
    }else{
        csv+=`"Set berjalan",${d.skorA},${d.skorB},"-"\\n`;
    }
    downloadBlob(csv,"hasil_stadion_kucur.csv","text/csv;charset=utf-8");
}

function downloadResultHTML(){
    const d=getResultData();
    const winner=d.skorA===d.skorB?'SERI':(d.skorA>d.skorB?d.timA:d.timB);
    const rows=d.hasilSet.length ? d.hasilSet.map((x,i)=>`
      <tr><td>SET ${i+1}</td><td>${x.a}</td><td>${x.b}</td><td>${escapeHtml(x.winner||'-')}</td></tr>`).join('')
      : `<tr><td>Set berjalan</td><td>${d.skorA}</td><td>${d.skorB}</td><td>-</td></tr>`;
    const doc=`<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Hasil ${escapeHtml(d.timA)} vs ${escapeHtml(d.timB)}</title>
    <style>body{font-family:Arial;padding:35px;color:#111}h1,h2,p{text-align:center}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border:1px solid #999;padding:10px;text-align:center}th{background:#eee}.sign{display:grid;grid-template-columns:1fr 1fr;gap:80px;text-align:center;margin-top:80px}.space{height:70px}</style></head>
    <body><h1>KARANG TARUNA BAKTI REMAJA</h1><h2>STADION KUCUR</h2><p><b>Jaten RW 005 • Miricinde • Purwantoro</b></p>
    <h2>${escapeHtml(d.timA)} ${d.skorA} — ${d.skorB} ${escapeHtml(d.timB)}</h2>
    <p><b>Hasil: ${escapeHtml(winner)}</b></p>
    <table><tr><th>Set</th><th>${escapeHtml(d.timA)}</th><th>${escapeHtml(d.timB)}</th><th>Pemenang</th></tr>${rows}</table>
    <p>Dicetak/dibuat: ${escapeHtml(d.waktu)}</p><div class="sign"><div>Wasit / Petugas<div class="space"></div>(________________)</div><div>Panitia<div class="space"></div>(________________)</div></div>
    </body></html>`;
    downloadBlob(doc,"hasil_stadion_kucur.html","text/html;charset=utf-8");
}

function downloadBlob(content,filename,type){
    const blob=new Blob([content],{type:type});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

</script>
